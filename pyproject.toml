[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudmusic"
dynamic = ["version"]
description = "A small Python client for NetEase Cloud Music"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "p697"}]
dependencies = ["requests>=2.32.4,<3", "pycryptodomex>=3.23,<4"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/p697/cloudmusic"
Issues = "https://github.com/p697/cloudmusic/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8", "build>=1.2,<2", "ruff>=0.11,<1"]

[tool.setuptools.dynamic]
version = {attr = "cloudmusic.__version__.__version__"}

[tool.setuptools.packages.find]
include = ["cloudmusic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: opt-in read-only checks against NetEase (requires --live)"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
