name: Publish to PyPI
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (must match the source)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pypi-release
  cancel-in-progress: false
jobs:
  test:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/ci.yml
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, runpy
          version = runpy.run_path('cloudmusic/__version__.py')['__version__']
          assert version == os.environ['RELEASE_VERSION'], 'Requested version differs from source'
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Verify isolated wheel installation
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -m venv /tmp/cloudmusic-release
          /tmp/cloudmusic-release/bin/pip install dist/*.whl
          cd /tmp
          /tmp/cloudmusic-release/bin/python -c "import os, cloudmusic; from importlib.metadata import version; assert cloudmusic.__version__ == version('cloudmusic') == os.environ['RELEASE_VERSION']"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cloudmusic/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
