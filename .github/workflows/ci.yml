name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest --cov=cloudmusic --cov-report=term-missing --cov-fail-under=90
      - run: python -m ruff check cloudmusic tests
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install build
      - run: python -m build
      - name: Install built wheel in isolation
        run: |
          python -m venv /tmp/cloudmusic-wheel
          /tmp/cloudmusic-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/cloudmusic-wheel/bin/python -c "import cloudmusic; from importlib.metadata import version; assert cloudmusic.__version__ == version('cloudmusic'); print(cloudmusic.__file__)"
